[build]
  publish = "build/web"
  command = "git clone https://github.com/flutter/flutter.git --depth 1 -b stable $HOME/flutter && export PATH=\"$PATH:$HOME/flutter/bin\" && flutter pub get && sed -i \"s|GOOGLE_WEB_CLIENT_ID_PLACEHOLDER|$GOOGLE_WEB_CLIENT_ID|g\" web/index.html && sed -i \"s|ADSENSE_PUBLISHER_ID_PLACEHOLDER|$ADSENSE_PUBLISHER_ID|g\" web/index.html && flutter build web --release --base-href / --dart-define=SUPABASE_URL=$SUPABASE_URL --dart-define=SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY --dart-define=LINE_CHANNEL_ID=$LINE_CHANNEL_ID --dart-define=LINE_CHANNEL_SECRET=$LINE_CHANNEL_SECRET --dart-define=GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID --dart-define=FCM_WEB_VAPID_KEY=$FCM_WEB_VAPID_KEY --dart-define=VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY --dart-define=ADSENSE_PUBLISHER_ID=$ADSENSE_PUBLISHER_ID --dart-define=ADSENSE_SLOT_ID=$ADSENSE_SLOT_ID --dart-define=ADMOB_BANNER_ANDROID=$ADMOB_BANNER_ANDROID --dart-define=ADMOB_BANNER_IOS=$ADMOB_BANNER_IOS"

[build.environment]
  # These keys appear in example/config files intentionally — not real leaks.
  SECRETS_SCAN_OMIT_KEYS = "ADMOB_BANNER_ANDROID,ADMOB_BANNER_IOS,ADSENSE_PUBLISHER_ID,GOOGLE_WEB_CLIENT_ID,FCM_WEB_VAPID_KEY"
  # Firebase client API keys are public by design; exclude the files that embed them.
  SECRETS_SCAN_OMIT_PATHS = "android/app/google-services.json,lib/firebase_options.dart,web/firebase-messaging-sw.js,build/web/**"

# Serve sw.js with the correct headers so it can control the full origin.
# Must come BEFORE the catch-all redirect so Netlify doesn't rewrite it.
[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
