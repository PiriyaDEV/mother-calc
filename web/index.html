  <!-- Image download/share helper for Flutter web (used by download_summary_dialog) -->
  <script>
    window._kidtangImageSaver = {
      /**
       * Triggers a browser file download from a data URL.
       * @param {string} dataUrl  - data:image/png;base64,...
       * @param {string} filename - e.g. "kidtang_summary_123.png"
       */
      download: function(dataUrl, filename) {
        var a = document.createElement('a');
        a.href = dataUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      },

      /**
       * Shares an image via the Web Share API (navigator.share).
       * Converts the data URL to a Blob/File first so iOS PWA can share to
       * other apps (LINE, iMessage, etc.).
       * Returns true on success, false if share was cancelled or failed.
       * @param {string} dataUrl
       * @param {string} filename
       * @param {string} title
       * @returns {Promise<boolean>}
       */
      share: async function(dataUrl, filename, title) {
        try {
          // Convert data URL → Blob → File
          var res = await fetch(dataUrl);
          var blob = await res.blob();
          var file = new File([blob], filename, { type: 'image/png' });

          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ title: title, files: [file] });
            return true;
          }
          // Fallback: share URL only (no file)
          if (navigator.share) {
            await navigator.share({ title: title, text: title });
            return true;
          }
          // No share API — fall back to download
          window._kidtangImageSaver.download(dataUrl, filename);
          return true;
        } catch (e) {
          // User cancelled (AbortError) or share failed
          if (e && e.name !== 'AbortError') {
            window._kidtangImageSaver.download(dataUrl, filename);
          }
          return false;
        }
      },

      /**
       * Returns true if the Web Share API with file support is available.
       * Used to decide whether to show the "แชร์รูปภาพ" button.
       */
      canShare: function() {
        try {
          // Quick probe: create a tiny PNG blob and check canShare
          var testFile = new File([''], 'test.png', { type: 'image/png' });
          return !!(navigator.canShare && navigator.canShare({ files: [testFile] }));
        } catch (e) {
          return !!(navigator.share);
        }
      }
    };
  </script>

  <!-- Web Push helper — exposes window._kidtangPush.subscribe / unsubscribe -->
  <!-- Called by lib/services/web_push_service_web.dart after login -->
  <script>
    window._kidtangPush = (function () {
      function urlBase64ToUint8Array(base64String) {
        var padding = '='.repeat((4 - (base64String.length % 4)) % 4);
        var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
        var rawData = atob(base64);
        var outputArray = new Uint8Array(rawData.length);
        for (var i = 0; i < rawData.length; ++i) {
          outputArray[i] = rawData.charCodeAt(i);
        }
        return outputArray;
      }

      return {
        /**
         * Requests notification permission, registers sw.js, subscribes to
         * Web Push with the given VAPID public key, and returns the
         * PushSubscription as a JSON string (or null on failure/denial).
         */
        subscribe: async function (vapidPublicKey) {
          try {
            if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
              console.warn('[WebPush] Push API not supported');
              return null;
            }
            var permission = await Notification.requestPermission();
            if (permission !== 'granted') {
              console.warn('[WebPush] Permission not granted:', permission);
              return null;
            }
            await navigator.serviceWorker.register('/sw.js');
            var reg = await navigator.serviceWorker.ready;
            var existing = await reg.pushManager.getSubscription();
            var sub = existing || await reg.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: urlBase64ToUint8Array(vapidPublicKey),
            });
            return JSON.stringify(sub.toJSON());
          } catch (e) {
            console.error('[WebPush] subscribe error:', e);
            return null;
          }
        },

        /**
         * Unsubscribes the current Push subscription (if any).
         */
        unsubscribe: async function () {
          try {
            if (!('serviceWorker' in navigator)) return false;
            var reg = await navigator.serviceWorker.ready;
            var sub = await reg.pushManager.getSubscription();
            if (sub) await sub.unsubscribe();
            return true;
          } catch (e) {
            console.error('[WebPush] unsubscribe error:', e);
            return false;
          }
        },
      };
    })();
  </script>
