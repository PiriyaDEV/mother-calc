name: kidtang_flutter
description: Kidtang - Bill splitting app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State management
  provider: ^6.1.2
  
  # Navigation
  go_router: ^13.2.0
  
  # Supabase
  supabase_flutter: ^2.5.6
  
  # Storage
  shared_preferences: ^2.2.3
  
  # UI
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.3.1
  
  # QR Code
  qr_flutter: ^4.1.0
  
  # HTTP
  http: ^1.2.1
  
  # Image picker
  image_picker: ^1.1.2
  
  # LINE Login SDK (official Flutter SDK by LINE)
  flutter_line_sdk: ^2.6.2

  intl: ^0.19.0
  uuid: ^4.4.0
  flutter_dotenv: ^5.1.0

  # Sign in with Apple
  sign_in_with_apple: ^6.1.4

  # Charts
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/i18n/
    - .env
